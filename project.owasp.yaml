    platform: slack
    url: https://owasp.slack.com/archives/C069PCXSW12
    description: "Slack channel for the new OWASP ModSecurity project.\n\nSee <https://owasp.org/blog/2024/01/09/ModSecurity.html>"
leaders:
  - name: Ervin Hegedus
    email: ervin.hegedus@owasp.org
